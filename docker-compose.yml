services:
  userportal:
    # Published by .github/workflows/docker.yml on every push to main.
    # Swap for `build: .` to build locally instead.
    image: ghcr.io/jae04cc/userportal:latest
    container_name: userportal
    restart: unless-stopped
    ports:
      # Host 3020 — scorecard uses 3000, fatbearweek 3010
      - "3020:3000"
    volumes:
      # SQLite database and uploaded service icons both persist here
      - ./data:/data
    environment:
      # These two are the ONLY environment variables the app takes. Everything
      # else — single sign-on, Uptime Kuma, session lifetime — is configured in
      # the admin area and stored in the database.
      - DATABASE_PATH=/data/userportal.db
      - UPLOADS_DIR=/data/uploads
      - NODE_ENV=production
      # - TZ=America/New_York

  # Point Pangolin at this container — no reverse-proxy labels are needed here,
  # Pangolin is configured separately.
  #
  # Recovery: if single sign-on is misconfigured and you're locked out, run
  #   docker compose exec userportal node scripts/reset-admin.mjs
  # then sign in at /login?local=1 with the printed password.
