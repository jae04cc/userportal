<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>Offline</title>
    <!--
      Deliberately standalone: no stylesheet, no font, no image. This page is
      shown precisely when the network is unreachable, so anything it had to
      fetch would fail with it. Colours are the portal's own so it doesn't
      flash white on a dark screen.
    -->
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
        background: #0b0f14;
        color: #e2e8f0;
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        text-align: center;
      }
      main {
        max-width: 26rem;
      }
      h1 {
        margin: 0 0 0.5rem;
        font-size: 1.125rem;
        font-weight: 600;
      }
      p {
        margin: 0 0 1.25rem;
        font-size: 0.875rem;
        line-height: 1.5;
        color: #94a3b8;
      }
      button {
        font: inherit;
        font-size: 0.875rem;
        padding: 0.5rem 1rem;
        border-radius: 0.375rem;
        border: 1px solid #0284c7;
        background: #0284c7;
        color: #fff;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>No connection</h1>
      <p>
        The portal couldn&rsquo;t be reached. If you&rsquo;re away from home, check that your VPN or
        network is connected.
      </p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
