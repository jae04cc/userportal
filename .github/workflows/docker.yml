name: Docker

# Manual only, deliberately.
#
# Publishing an image is an outward-facing action and this repo has no registry
# credentials configured, so running it on every push just failed every push.
# Run it from the Actions tab once you've decided where images should go.
#
# To publish to Docker Hub (matching scorecard/fatbearweek), add repository
# secrets DOCKERHUB_USERNAME and DOCKERHUB_TOKEN, then optionally re-add:
#   on:
#     push:
#       branches: [main]
on:
  workflow_dispatch:

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - name: Check registry credentials are configured
        env:
          USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "$USERNAME" ] || [ -z "$TOKEN" ]; then
            echo "::error::DOCKERHUB_USERNAME and DOCKERHUB_TOKEN repository secrets are not set."
            echo "Add them under Settings -> Secrets and variables -> Actions, then re-run."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/userportal:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/userportal:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
