name: Docker

# Publishes jae04cc/userportal:latest and :<sha> to Docker Hub.
#
# Requires two repository secrets — Settings → Secrets and variables → Actions:
#   DOCKERHUB_USERNAME  your Docker Hub username
#   DOCKERHUB_TOKEN     a Docker Hub access token with Read & Write
#
# The preflight step below fails with a clear message if either is missing,
# rather than letting the login action emit an opaque error.
#
# Still manual-only until those secrets exist — enabling the push trigger first
# would just fail on every commit. Once they're set, uncomment the push block to
# publish automatically on every merge to main.
on:
  # push:
  #   branches: [main]
  workflow_dispatch:

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - name: Check registry credentials are configured
        env:
          USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "$USERNAME" ] || [ -z "$TOKEN" ]; then
            echo "::error::DOCKERHUB_USERNAME and DOCKERHUB_TOKEN repository secrets are not set."
            echo "Add them under Settings -> Secrets and variables -> Actions, then re-run."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/userportal:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/userportal:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
