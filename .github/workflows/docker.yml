name: Docker

# Publishes to GitHub Container Registry: ghcr.io/jae04cc/userportal
#
# No secrets to configure — authentication uses the GITHUB_TOKEN that every
# workflow run is issued automatically. That's the whole reason this targets
# ghcr rather than Docker Hub: personal GitHub accounts have no shared secret
# store, so a Docker Hub token would have to be re-added to every repository.
on:
  push:
    branches: [main]
  workflow_dispatch:
  # Weekly rebuild without the layer cache, so security fixes in the Node base image and Debian
  # packages reach the image even in weeks with no code changes. Pull & Redeploy to pick it up.
  # Running the workflow by hand does the same, for a fix that should not wait for Monday.
  schedule:
    - cron: "23 9 * * 1"

jobs:
  push:
    runs-on: ubuntu-latest

    # GITHUB_TOKEN is read-only by default; publishing a package needs this.
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ghcr requires a lowercase image path, and github.repository preserves
      # the owner's original casing.
      - name: Resolve image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          # Always start from the newest node:26-slim, and rebuild every layer on the weekly run
          # and on a run started by hand.
          pull: true
          no-cache: ${{ github.event_name != 'push' }}
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
